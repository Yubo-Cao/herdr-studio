[Service]
# Cold starts and reboots must launch the deployed fork, not a distro-owned
# stock binary that may also be installed on the host.
ExecStart=
ExecStart=%h/.local/bin/herdr server

# The handoff import is spawned by the old server and remains in this cgroup.
# Track the whole cgroup so the original MainPID may exit without systemd
# declaring the service stopped and killing or restarting its replacement.
ExitType=cgroup

# `restart` is intentionally a cold, destructive operation for this service.
# `reload` performs the process-preserving server replacement instead.
ExecReload=
ExecReload=%h/.local/bin/herdr server live-handoff --import-exe %h/.local/bin/herdr

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/roamgate-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/roamgate-icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/roamgate-icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/roamgate-icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/roamgate-icon-180.png" />
    <meta name="theme-color" content="#0e1014" />
    <meta name="application-name" content="Roamgate" />
    <meta name="apple-mobile-web-app-title" content="Roamgate" />
    <title>Roamgate</title>
    <script>
      // Disable pinch zoom for the terminal UI on touch-primary devices
      // (phones and tablets). The viewport directive above covers PWAs and
      // Android, but iOS Safari ignores user-scalable, so suppress the
      // WebKit gesture events that drive pinch zoom as well. Fine-pointer
      // desktops keep their trackpad pinch zoom.
      if (window.matchMedia("(pointer: coarse)").matches) {
        for (const type of ["gesturestart", "gesturechange", "gestureend"]) {
          document.addEventListener(type, (event) => event.preventDefault(), {
            passive: false,
          });
        }
      }
    </script>
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the
      // default dark theme. "system" resolves via the OS color scheme.
      try {
        const storedTheme =
          localStorage.getItem("roamgate:theme") ?? localStorage.getItem("theme");
        const resolvedTheme =
          storedTheme === "light" || storedTheme === "dark"
            ? storedTheme
            : storedTheme === "system" &&
                window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = resolvedTheme;
        document.documentElement.style.colorScheme = resolvedTheme;
        // Apply the persisted interface scale too so the first paint matches
        // the Text size preference.
        const storedUiScale =
          localStorage.getItem("roamgate:uiScale") ?? localStorage.getItem("uiScale");
        const uiScale = storedUiScale === null ? 100 : Number(storedUiScale);
        if (Number.isFinite(uiScale) && uiScale !== 100) {
          // Keep in sync with clampUiScale in web/src/appearance.ts.
          const clampedUiScale = Math.min(
            150,
            Math.max(80, Math.round(uiScale / 5) * 5),
          );
          document.documentElement.style.zoom = String(clampedUiScale / 100);
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
